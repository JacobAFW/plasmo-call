# =============================================================================
# plasmo-call — main configuration
# Copy/edit this file for your run. NOTHING here should contain institute
# paths, accounts, or storage flags (those live in profiles/, see README).
# =============================================================================

# ---- Input data -------------------------------------------------------------
# Directory of paired FASTQs named {sample}_1.fastq.gz / {sample}_2.fastq.gz
source_dir: ""            # e.g. "data/fastq"

# ---- Reference genome (malaria default expected; keep configurable) ---------
reference:
  fasta: ""               # e.g. "reference/PknowlesiA1H1.fasta" (.fai + .dict auto-made)
  bed:   ""               # intervals/contigs bed for job subsetting

# ---- Aligner ----------------------------------------------------------------
aligner: "bwa"            # "bwa" (bwa mem) | "bwa-mem2"  (drop-in, same output)

# ---- BQSR / known variants --------------------------------------------------
# mode:
#   auto         -> if known_variants below is blank => bootstrap; else known_sites
#                   (the chosen path is logged LOUDLY at run start)
#   known_sites  -> use the supplied known_variants VCF(s); error if none given
#   bootstrap    -> ignore any VCF; call w/ BQSR off -> hard-filter -> use as known-sites
#   off          -> skip BQSR entirely
bqsr:
  # Default OFF for the safest run. Flip to auto/known_sites/bootstrap when
  # you have decided which calibration path you want. The resolved mode is
  # printed as a banner at workflow start (stderr) — never silent.
  mode: "off"
  known_variants: []      # e.g. ["reference/known_sites.vcf.gz"]
  bootstrap:
    iterations: 1         # 1 = single bootstrap pass; >1 to iterate
    # hard-filter expression used to build the high-confidence bootstrap set
    snv_filter:  "QD<2.0 || FS>60.0 || MQ<40.0 || MQRankSum<-12.5 || ReadPosRankSum<-8.0"
    indel_filter: "QD<2.0 || FS>200.0 || ReadPosRankSum<-20.0"

# ---- Species preset (HaplotypeCaller priors) --------------------------------
# Points at a file in config/species/. NO default — you MUST choose explicitly,
# so non-vivax data can never be silently called with vivax priors.
# vivax is the ONLY documented preset (0.0029 / 0.0017); knowlesi/malariae/ovale
# ship as TBD stubs that hard-fail until you set their priors.
species: ""               # REQUIRED: vivax | knowlesi | malariae | ovale

# ---- Joint calling / consolidation ------------------------------------------
# For large cohorts (~980 samples), CombineGVCFs bottlenecks (single-threaded
# and memory-heavy at cohort scale) and per-CHROMOSOME GenotypeGVCFs hits HPC
# walltime. GenomicsDBImport builds one workspace per genomic INTERVAL (same
# split the bcftools arm uses), and GenotypeGVCFs then runs per-interval — so
# joint calling parallelises across the 100+ interval jobs instead of 16 chroms.
# HaplotypeCaller stays per-sample whole-genome (Pk genome ~24 Mb — per-sample
# HC is already fast and gives one parallel job per sample).
joint_calling:
  consolidation: "genomicsdb"    # genomicsdb (default, scale-first) | combine_gvcfs (legacy / small cohorts)
  genomicsdb:
    batch_size:     50            # --batch-size for GenomicsDBImport (samples per batch)
    reader_threads:  1            # --reader-threads (bump if I/O-bound reading GVCFs)

# ---- Post-calling filter tiers + funnel stats (Prompt H) -------------------
# The filter layer consumes ONLY the finished Consensus.vcf.gz — no BAMs, no
# per-chrom VCFs. That decoupling is deliberate: amending a threshold and
# re-running regenerates the stats + tier VCFs in seconds WITHOUT re-calling.
#
# THREE VCFs are ALWAYS produced side by side:
#   * output/calling/consensus/Consensus.vcf.gz        — raw (unchanged base)
#   * output/calling/consensus/Consensus.light.vcf.gz  — LIGHT: QUAL floor only
#   * output/calling/consensus/Consensus.hard.vcf.gz   — HARD: Sanger-style
#                                                        GATK hard filters
# Plus the funnel stats report:
#   * output/filter/stats.txt  — human-readable RAW → LIGHT → HARD funnel +
#                                per-site distributions of QUAL/QD/FS/MQ/
#                                MQRankSum/ReadPosRankSum/SOR with tier
#                                thresholds annotated.
#   * output/filter/stats.tsv  — per-site machine-readable table.
#
# Tier definitions and rationale — see docs/filter.md. Short version:
#   * LIGHT = vivaxgen-equivalent QUAL floor. NO DP filter — per-sample DP is
#            tier-2 downstream, out of scope here (matches vivaxgen, which
#            applies --mindepth per-sample in single-sample reports, not on
#            the joint cohort VCF).
#   * HARD  = Jacob's published Sanger-style GATK hard filter (QD < qd, FS >
#            fs, MQ < mq) applied to SNPs AND indels alike. Source:
#            JacobAFW/Pk_Malaysian_Population_Genetics 05_Variant_filtering.
#   * Rank-sum tests (MQRankSum, ReadPosRankSum) and SOR are diploid-tuned —
#            defined only at HET sites. Plasmodium is HAPLOID (called at
#            diploid ploidy to capture mixed/polyclonal infections,
#            quantified downstream by Fws / COI); those thresholds don't
#            transfer. Per GATK non-model-organism + Sanger/MalariaGEN
#            guidance they are SHOWN in the report but NOT filtered.
#            Do NOT add them as filters.
#
# NO region masking here. Core-genome / hypervariable (subtelomeric,
# SICAvar, kir) masking stays in the downstream analysis workflow.
filter:
  light:
    min_qual: 30           # vivaxgen-equivalent QUAL floor
  hard:
    qd: 15.0               # QD < qd  → fail  (Sanger-style QD15)
    fs:  1.0               # FS > fs  → fail  (Sanger-style FS1)
    mq: 40.0               # MQ < mq  → fail  (Sanger-style MQ40)

# ---- Resources (logical; mapped to scheduler in profiles/) ------------------
threads:
  bwa: 5
  sort: 5
